
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Aroma</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            color: #292344;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 34px;
            border-radius: 22px;
            box-shadow: 0 15px 45px #43307818;
        }
        .logo { font-size: 36px; text-align: center; }
        h1 { text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #77718c; margin-bottom: 24px; }
        label { display: block; margin: 14px 0 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd7f0;
            border-radius: 10px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #7353d6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer { text-align: center; margin-top: 20px; }
        a { color: #6849c5; text-decoration: none; font-weight: 600; }
        .message { padding: 10px; border-radius: 8px; background: #f5f0ff; margin: 8px 0; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">🌿</div>
        <h1>Create Account</h1>
        <p class="subtitle">Start your personal wellness journey</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text" required autocomplete="name">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required autocomplete="email">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">

            <button type="submit">Create Account</button>
        </form>

        <p class="footer">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </main>
</body>
</html>
